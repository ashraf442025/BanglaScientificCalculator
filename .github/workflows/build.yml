name: Build Bangla Scientific Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Show build environment
        run: |
          python --version
          python -m pip --version
          buildozer --version
          git --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Scientific-Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
