name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Bangla Calculator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer
          export ACCEPT_ANDROID_SDK_LICENSE=1

      - name: Build APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          P4A_BUILD_DIR: ${{ github.workspace }}/.buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Scientific-Calculator
          path: bin/*.apk
