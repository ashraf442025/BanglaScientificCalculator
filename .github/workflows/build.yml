name: Build Bangla Scientific Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Prepare Buildozer Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O tools.zip

          unzip -q tools.zip
          rm tools.zip

          rm -rf latest
          mv cmdline-tools latest

          # Buildozer 1.5.0 expects the legacy tools/bin path.
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

      - name: Accept SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Installed Build Tools:"
          ls -la "$SDK/build-tools"

          echo "Checking AIDL:"
          "$SDK/build-tools/35.0.0/aidl" || test $? -eq 1

          echo "Checking Android API 35:"
          test -f "$SDK/platforms/android-35/android.jar"

          echo "Checking SDK Manager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "Checking NDK:"
          ls -la "$SDK/ndk"

          echo "Android SDK verification successful."

      # ---------------------------------------------------------
      # IMPORTANT:
      # p4a master currently upgrades its temporary build venv
      # to pip 26.x, which is incompatible with p4a's installer.py.
      #
      # We clone p4a ourselves and patch that command to stay
      # below pip 26.
      # ---------------------------------------------------------
      - name: Prepare patched Python-for-Android
        run: |
          P4A="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"

          rm -rf "$P4A"

          mkdir -p "$(dirname "$P4A")"

          git clone \
            --branch master \
            --single-branch \
            https://github.com/kivy/python-for-android.git \
            "$P4A"

          cd "$P4A"

          echo "Original p4a commit:"
          git log -1 --oneline

          echo "Patching pip upgrade..."

          python - <<'PY'
          from pathlib import Path

          path = Path("pythonforandroid/build.py")
          text = path.read_text()

          old = "pip install -U pip"
          new = "pip install -U 'pip<26'"

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected 'pip install -U pip' was not found in "
                  "pythonforandroid/build.py"
              )

          text = text.replace(old, new)

          old_venv = "host_python, '-m', 'venv', 'venv'"
          new_venv = "host_python, '-m', 'venv', '--clear', 'venv'"

          if old_venv in text:
              text = text.replace(old_venv, new_venv)
          else:
              print("WARNING: venv creation line was not found; continuing.")

          path.write_text(text)
          PY

          echo "Patched p4a:"
          grep -n -A2 -B2 "pip install -U" pythonforandroid/build.py || true

          echo "Checking venv creation:"
          grep -n "venv.*--clear" pythonforandroid/build.py || true

      - name: Clean Buildozer build directories
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/build
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a

          echo "Build directories cleaned."

      - name: Show build environment
        run: |
          echo "Host Python:"
          python --version

          echo "Host pip:"
          python -m pip --version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "p4a:"
          cd "$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          git log -1 --oneline

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Scientific-Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
