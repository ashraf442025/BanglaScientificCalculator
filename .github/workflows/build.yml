name: Build Bangla Scientific Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

      - name: Prepare Buildozer Android SDK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandline-tools.zip

          rm -rf latest

          unzip -q commandline-tools.zip

          mv cmdline-tools latest

          rm commandline-tools.zip

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Verify Android Build Tools
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          test -f "$SDK/build-tools/37.0.0/aapt2"
          test -f "$SDK/build-tools/37.0.0/aidl"

          echo "Android Build Tools 37.0.0 installed successfully."
          "$SDK/build-tools/37.0.0/aidl" --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Scientific-Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
